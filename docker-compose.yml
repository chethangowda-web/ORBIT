services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbit-network

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Set PYTHON_IMAGE=mirror.gcr.io/library/python:3.11-slim if Docker Hub is unreachable.
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    container_name: orbit-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-orbit}
      - REDIS_URL=redis://redis:6379/0
      - SEED_ON_START=${SEED_ON_START:-false}
    ports:
      - "${PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - orbit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Set NODE_IMAGE=mirror.gcr.io/library/node:20-alpine if Docker Hub is unreachable.
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        # Inlined at build time; this is the URL the *browser* uses to reach the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api}
    container_name: orbit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - orbit-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  orbit-network:
    driver: bridge
