name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Tests (offline: no LLM or Google calls)
        run: pytest -q
      - name: Models and migrations agree
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-check.db
          SCHEDULER_JOBSTORE: memory
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001/api

  e2e:
    name: End to end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: password
          POSTGRES_DB: orbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://orbit:password@localhost:5432/orbit
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGINS: '["http://localhost:3000"]'
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies, schema and demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m db.seed
      - name: Start API
        working-directory: backend
        run: |
          nohup uvicorn main:app --port 8001 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8001/health && break; sleep 2; done
      - name: Build and start dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm start > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/login > /dev/null && break; sleep 2; done
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            api.log
            web.log
            frontend/test-results
